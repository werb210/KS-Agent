name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # KS_AGENT_v1_CI - Node 22, the version in package.json "engines", .nvmrc, the Dockerfile and KS-server's CI.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # AGENT_v789_CI - fail on any high or critical advisory.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # KS_AGENT_v1_BRANDING - replies, prompts and tool descriptions name the licensee, never the previous owner.
      - name: No previous-owner branding in src string literals
        run: npm run check:brand

      # AGENT_v789_SOURCE_GREP - no new tests that assert on source text.
      - name: Source-grep test guard
        run: npm run check:source-grep

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify artifact
        run: |
          test -f dist/index.js
          node -e "const fs=require('fs'); const s=fs.statSync('dist/index.js'); if(!s.size){process.exit(1)}"
