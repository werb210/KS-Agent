name: Build and deploy the assistant to Azure Web App

# KS_AGENT_v1_DEPLOY - mirrors KS-server's deploy.yml. Runs only after the "CI" workflow finished successfully for a
# push to main (or by hand), and deploys exactly the commit CI tested. The development copy's target is set by
# repository settings (the job is skipped while AZURE_WEBAPP_NAME is empty):
#   secrets.AZURE_CREDENTIALS    service principal (az ad sp create-for-rbac --sdk-auth) limited to the dev group
#   vars.AZURE_WEBAPP_NAME       the Web App to deploy to (e.g. ks-agent-dev)
# KS_SHARED_HOSTING_v1 - every brokerage is served by ONE shared assistant (ks-shared-agent, next to ks-shared-server);
# the shared-deploy job below deploys it once. There is no per-brokerage matrix any more: each brokerage's settings
# live in the ks_control registry, not in GitHub. deploy/licensees.json stays (CI still validates it) as the list of
# brokerages whose web builds are published.
# App settings on the development Web App (not here): SERVER_URL, JWT_SECRET (same as KS-server), OPENAI_API_KEY,
# SCM_DO_BUILD_DURING_DEPLOYMENT=false. App Service sets PORT.
# App settings on the shared Web App: SERVER_URL (the shared server), OPENAI_API_KEY, KS_CONTROL_DATABASE_URL
# (role ks_control_reader), KS_TENANT_KEY, SCM_DO_BUILD_DURING_DEPLOYMENT=false. No JWT_SECRET: each brokerage's
# comes from its env_enc.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        required: false
        default: all
        type: choice
        options: [all, development, shared]

concurrency:
  group: deploy-ks-agent
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    # No assistant Web App yet (AZURE_WEBAPP_NAME unset): skip instead of failing every push.
    # KS_SHARED_HOSTING_v1 - a manual run for the shared app only leaves the development copy alone.
    if: >-
      vars.AZURE_WEBAPP_NAME != '' && (
      (github.event_name == 'workflow_dispatch' && inputs.target != 'shared') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push'))

    steps:
      - uses: actions/checkout@v5
        with:
          # The commit CI tested; a manual dispatch deploys the selected ref.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check deployment settings
        env:
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          if [ -z "$AZURE_WEBAPP_NAME" ]; then
            echo "::error::Set the AZURE_WEBAPP_NAME repository variable to the licensee's assistant Web App."
            exit 1
          fi

      # Node 22: package.json "engines", .nvmrc, the Dockerfile and KS-server all use 22.
      - name: Use Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build
        run: |
          test -f dist/index.js
          node -e "const s=require('fs').statSync('dist/index.js'); if(!s.size){process.exit(1)}"

      - name: Prune dev deps
        run: npm prune --omit=dev

      - name: Create deployment package
        run: |
          zip -r release.zip dist node_modules package.json package-lock.json -x "node_modules/.cache/*"

      # Azure login (service principal from AZURE_CREDENTIALS)
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: release.zip

  # KS_SHARED_HOSTING_v1 - the one shared assistant for every brokerage (resource group ks-shared). Settings:
  #   variable AZURE_WEBAPP_NAME_SHARED   optional; default ks-shared-agent
  #   sign-in, either
  #     variables AZURE_SHARED_CLIENT_ID + AZURE_SHARED_TENANT_ID + AZURE_SHARED_SUBSCRIPTION_ID   a deploy identity
  #               with a federated credential for this repository's main branch (no secret), or
  #     secret    AZURE_CREDENTIALS_SHARED   a service principal's JSON limited to ks-shared
  # Its own sign-in, never the development copy's AZURE_CREDENTIALS. Until one is set the job says so and skips the
  # deploy instead of failing every push. Separate from the development deploy above, so neither blocks the other.
  shared-deploy:
    runs-on: ubuntu-24.04
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.target != 'development') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-ks-agent-shared
      cancel-in-progress: false
    steps:
      - name: Check the shared app's settings
        id: settings
        env:
          AZURE_WEBAPP_NAME_SHARED: ${{ vars.AZURE_WEBAPP_NAME_SHARED }}
          AZURE_SHARED_CLIENT_ID: ${{ vars.AZURE_SHARED_CLIENT_ID }}
          AZURE_SHARED_TENANT_ID: ${{ vars.AZURE_SHARED_TENANT_ID }}
          AZURE_SHARED_SUBSCRIPTION_ID: ${{ vars.AZURE_SHARED_SUBSCRIPTION_ID }}
          AZURE_CREDENTIALS_SHARED: ${{ secrets.AZURE_CREDENTIALS_SHARED }}
        run: |
          app="${AZURE_WEBAPP_NAME_SHARED:-ks-shared-agent}"
          echo "webapp=$app" >> "$GITHUB_OUTPUT"
          if [ -n "$AZURE_SHARED_CLIENT_ID" ] && [ -n "$AZURE_SHARED_TENANT_ID" ] && [ -n "$AZURE_SHARED_SUBSCRIPTION_ID" ]; then
            echo "login=oidc" >> "$GITHUB_OUTPUT"
          elif [ -n "$AZURE_CREDENTIALS_SHARED" ]; then
            echo "login=creds" >> "$GITHUB_OUTPUT"
          else
            echo "login=none" >> "$GITHUB_OUTPUT"
            echo "::warning title=shared assistant not deployed::Set the variables AZURE_SHARED_CLIENT_ID, AZURE_SHARED_TENANT_ID and AZURE_SHARED_SUBSCRIPTION_ID (or the secret AZURE_CREDENTIALS_SHARED) to deploy $app."
            exit 0
          fi
          echo "Deploying to $app"

      - uses: actions/checkout@v5
        if: steps.settings.outputs.login != 'none'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Use Node
        if: steps.settings.outputs.login != 'none'
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: npm

      - name: Install deps
        if: steps.settings.outputs.login != 'none'
        run: npm ci

      - name: Build
        if: steps.settings.outputs.login != 'none'
        run: npm run build

      - name: Verify build
        if: steps.settings.outputs.login != 'none'
        run: |
          test -f dist/index.js
          node -e "const s=require('fs').statSync('dist/index.js'); if(!s.size){process.exit(1)}"

      - name: Prune dev deps
        if: steps.settings.outputs.login != 'none'
        run: npm prune --omit=dev

      - name: Create deployment package
        if: steps.settings.outputs.login != 'none'
        run: |
          zip -q -r release.zip dist node_modules package.json package-lock.json -x "node_modules/.cache/*"

      - name: Azure Login (federated deploy identity)
        if: steps.settings.outputs.login == 'oidc'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_SHARED_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_SHARED_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SHARED_SUBSCRIPTION_ID }}

      - name: Azure Login
        if: steps.settings.outputs.login == 'creds'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_SHARED }}

      - name: Deploy to Azure
        if: steps.settings.outputs.login != 'none'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.settings.outputs.webapp }}
          package: release.zip
